name: Build IEM Tool (Win + Mac + Linux)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: write

jobs:
  # Fast gate. Runs before any packaging so a parse error, an orphaned file, a
  # dead button, or a bundle-order mistake that would ship a blank app fails in
  # ~10 seconds instead of after three 30-minute electron-builder runs.
  # The dist* scripts also run these via `package:prepare`, so this job is for
  # fast feedback, not the only enforcement.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse every script
        run: npm run check:js

      - name: No orphaned / dangling script references
        run: npm run check:reach

      - name: No dead controls, safe bundle order, no new inline handlers
        run: npm run check:integrity

      - name: This workflow still gates every build on the checks
        # Guards against this file drifting: e.g. someone dropping
        # `needs: [verify, verify-ui]` from a build job, or removing the xvfb /
        # no-sandbox wiring, which would silently make the gates decorative.
        run: npm run check:workflow

  # Behavioural gate. The static checks above cannot tell you that the event
  # delegation, the volume sync or the file-picker keyboard paths actually work
  # in a browser - they only read source. These suites drive the real app in
  # Electron and assert observable behaviour.
  #
  # Kept out of `npm run check` on purpose: that stays pure static analysis so it
  # needs neither a display nor Electron. This job needs both, hence xvfb.
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch the Electron binary
        # Electron 43's npm package has no postinstall, so `npm ci` installs the
        # package but not the binary - it is downloaded lazily on first require.
        # Without this step the verify-ui runner finds no binary, and because it
        # used to exit 0 in that case the whole behavioural gate passed silently
        # without running a single suite. Resolving it here makes a download
        # failure an explicit, named step failure instead.
        run: node -e "console.log('electron binary:', require('electron'))"

      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          # Several of these were renamed in the t64 transition (libasound2 ->
          # libasound2t64 and friends). Verified on Ubuntu 26.04: `apt-get install
          # libasound2` fails with "no installation candidate" even though
          # `apt-cache show` still lists the name, which is why this tries the
          # t64 spellings first and falls back to the old ones.
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 \
            libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 \
            libxrandr2 xvfb \
            || sudo apt-get install -y --no-install-recommends \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 \
            libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xvfb

      - name: Behavioural verification (event delegation, a11y, volume sync)
        # No sound card on a runner, and Chromium in a container needs
        # --no-sandbox. All six suites are verified to pass with audio output
        # disabled, so this should not be sensitive to the missing device.
        env:
          IEM_VERIFY_CHROMIUM_FLAGS: --no-sandbox --disable-audio-output --mute-audio --disable-gpu
        run: xvfb-run -a --server-args="-screen 0 1600x900x24" npm run verify:ui

  build-linux:
    needs: [verify, verify-ui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        timeout-minutes: 30
        run: npm run dist-linux

      - name: Rename to exact file name
        run: |
          src=$(ls dist/*.AppImage | head -n 1)
          cp "$src" "dist/IEM-Tool.appimage"
          ls -la dist/IEM-Tool.appimage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IEM-Tool-Linux
          path: dist/IEM-Tool.appimage

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IEM-Tool.appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [verify, verify-ui]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (portable .exe - no installer)
        # electron-builder's `portable` target emits ONE self-contained .exe:
        # no installer, no admin rights, nothing written outside its own
        # folder. Settings and saved reviews go to IEM-Profile/ beside the
        # exe and optional database updates are read from IEM-Data/ beside it
        # (see main.js).
        timeout-minutes: 30
        run: npm run dist-win

      - name: Rename to exact file name
        # Fail loudly if the portable exe is missing, and refuse to publish if
        # an installer-style "Setup" exe sneaks back in via a config change.
        run: |
          $src = Get-ChildItem "dist/*-Portable.exe" | Select-Object -First 1
          if (-not $src) { Write-Error "no portable exe was produced"; Get-ChildItem dist; exit 1 }
          if (Get-ChildItem "dist/*Setup*.exe" -ErrorAction SilentlyContinue) { Write-Error "installer exe found - win target must be portable"; exit 1 }
          Copy-Item $src.FullName "dist/IEM-Tool.exe"
          Get-ChildItem "dist/IEM-Tool.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IEM-Tool-Windows
          path: dist/IEM-Tool.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IEM-Tool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: [verify, verify-ui]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        timeout-minutes: 30
        run: npm run dist-mac

      - name: Rename to exact file names
        # The mac target builds BOTH arm64 and x64 DMGs, so `ls | head -n 1`
        # would pick one by alphabetical accident and silently ship only that
        # architecture - Intel Mac users would get a DMG that cannot run, while
        # the job still reported success. Select each arch explicitly and fail
        # loudly if either is missing.
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            src=$(ls dist/*-"$arch".dmg 2>/dev/null | head -n 1 || true)
            if [ -z "$src" ]; then
              echo "::error::no $arch DMG was produced; dist contains:"
              ls -la dist/
              exit 1
            fi
            cp "$src" "dist/IEM-Tool-$arch.dmg"
          done
          # Keep the unsuffixed name pointing at the arm64 build, which is the
          # large majority of Macs, for anyone linking to it directly.
          cp dist/IEM-Tool-arm64.dmg dist/IEM-Tool.dmg
          ls -la dist/IEM-Tool.dmg dist/IEM-Tool-arm64.dmg dist/IEM-Tool-x64.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IEM-Tool-macOS
          path: |
            dist/IEM-Tool.dmg
            dist/IEM-Tool-arm64.dmg
            dist/IEM-Tool-x64.dmg

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IEM-Tool.dmg
            dist/IEM-Tool-arm64.dmg
            dist/IEM-Tool-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Update rolling latest release (overwrite)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: Automatically rebuilt on every push to main. Contains IEM-Tool.exe (portable, no installer), IEM-Tool.dmg (Apple Silicon), IEM-Tool-x64.dmg (Intel) and IEM-Tool.appimage (portable; run chmod +x first).
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: release-files/IEM-Tool-Windows/IEM-Tool.exe,release-files/IEM-Tool-macOS/IEM-Tool.dmg,release-files/IEM-Tool-macOS/IEM-Tool-x64.dmg,release-files/IEM-Tool-Linux/IEM-Tool.appimage