name: Build IEM Tool (Win + Mac + Linux)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: write

jobs:
  # Fast gate. Runs before any packaging so a parse error, an orphaned file, a
  # dead button, or a bundle-order mistake that would ship a blank app fails in
  # ~10 seconds instead of after three 30-minute electron-builder runs.
  # The dist* scripts also run these via `package:prepare`, so this job is for
  # fast feedback, not the only enforcement.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse every script
        run: npm run check:js

      - name: No orphaned / dangling script references
        run: npm run check:reach

      - name: No dead controls, safe bundle order, no new inline handlers
        run: npm run check:integrity

      - name: This workflow still gates every build on the checks
        # Guards against this file drifting: e.g. someone dropping
        # `needs: [verify, verify-ui]` from a build job, or removing the xvfb /
        # no-sandbox wiring, which would silently make the gates decorative.
        run: npm run check:workflow

  # Behavioural gate. The static checks above cannot tell you that the event
  # delegation, the volume sync or the file-picker keyboard paths actually work
  # in a browser - they only read source. These suites drive the real app in
  # Electron and assert observable behaviour.
  #
  # Kept out of `npm run check` on purpose: that stays pure static analysis so it
  # needs neither a display nor Electron. This job needs both, hence xvfb.
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch the Electron binary
        # Electron 43's npm package has no postinstall, so `npm ci` installs the
        # package but not the binary - it is downloaded lazily on first require.
        # Without this step the verify-ui runner finds no binary, and because it
        # used to exit 0 in that case the whole behavioural gate passed silently
        # without running a single suite. Resolving it here makes a download
        # failure an explicit, named step failure instead.
        run: node -e "console.log('electron binary:', require('electron'))"

      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          # Several of these were renamed in the t64 transition (libasound2 ->
          # libasound2t64 and friends). Verified on Ubuntu 26.04: `apt-get install
          # libasound2` fails with "no installation candidate" even though
          # `apt-cache show` still lists the name, which is why this tries the
          # t64 spellings first and falls back to the old ones.
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 \
            libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 \
            libxrandr2 xvfb \
            || sudo apt-get install -y --no-install-recommends \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 \
            libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xvfb

      - name: Behavioural verification (event delegation, a11y, volume sync)
        # No sound card on a runner, and Chromium in a container needs
        # --no-sandbox. All six suites are verified to pass with audio output
        # disabled, so this should not be sensitive to the missing device.
        env:
          IEM_VERIFY_CHROMIUM_FLAGS: --no-sandbox --disable-audio-output --mute-audio --disable-gpu
        run: xvfb-run -a --server-args="-screen 0 1600x900x24" npm run verify:ui

  build-linux:
    needs: [verify, verify-ui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        timeout-minutes: 30
        run: npm run dist-linux

      - name: Rename to exact file name
        run: |
          src=$(ls dist/*.AppImage | head -n 1)
          cp "$src" "dist/IEM-Tool.appimage"
          ls -la dist/IEM-Tool.appimage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IEM-Tool-Linux
          path: dist/IEM-Tool.appimage

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IEM-Tool.appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [verify, verify-ui]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (NSIS installer)
        # electron-builder's `nsis` target emits a normal Setup wizard. Unlike
        # the old `portable` target (which unpacks itself to a temp folder on
        # EVERY launch - the cause of the slow start) an installed app starts
        # straight from disk. Settings and saved reviews live in
        # %APPDATA%\iem-tool; optional database updates go in the IEM-Data
        # folder there, which Settings -> Data -> "Open database folder" opens
        # (see main.js).
        timeout-minutes: 30
        run: npm run dist-win

      - name: Rename to exact file name
        # Fail loudly if the installer is missing, and refuse to publish if a
        # portable exe sneaks back in via a config change.
        run: |
          $src = Get-ChildItem "dist/*Setup*.exe" | Select-Object -First 1
          if (-not $src) { Write-Error "no installer exe was produced"; Get-ChildItem dist; exit 1 }
          if (Get-ChildItem "dist/*-Portable.exe" -ErrorAction SilentlyContinue) { Write-Error "portable exe found - win target must be the NSIS installer"; exit 1 }
          Copy-Item $src.FullName "dist/IEM-Tool-Setup.exe"
          Get-ChildItem "dist/IEM-Tool-Setup.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IEM-Tool-Windows
          path: dist/IEM-Tool-Setup.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IEM-Tool-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: [verify, verify-ui]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        # ONE universal DMG. electron-builder builds x64 and arm64 separately and
        # merges them with lipo, so a single IEM-Tool.dmg runs on both Intel and
        # Apple Silicon Macs. That is what lets the release ship exactly one file
        # per OS instead of one per architecture.
        #
        # `identity: null` in package.json stops electron-builder hunting for a
        # signing certificate it will never find - the app is unsigned, and the
        # universal merge step fails outright if it decides to codesign.
        #
        # This is the slowest of the three builds (two architectures plus a
        # merge), hence the extra headroom on the timeout.
        timeout-minutes: 45
        run: npm run dist-mac

      - name: Verify and rename to exact file name
        # Fail loudly unless EXACTLY one DMG was produced, then prove the merged
        # app really carries both architectures.
        #
        # Both checks exist because the failure they catch is silent. A glob like
        # `ls dist/*.dmg | head -n 1` would happily publish an arm64-only DMG
        # after someone reverted package.json's arch list - every Apple Silicon
        # user is fine, every Intel Mac gets "app can't be opened", and the job
        # still reports success. Counting to exactly 1 plus a lipo probe makes
        # that a red build instead.
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 universal DMG, found ${#dmgs[@]}; dist contains:"
            ls -la dist/
            exit 1
          fi
          cp "${dmgs[0]}" "dist/IEM-Tool.dmg"

          # The built .app is left beside the DMG. If we can find its executable,
          # require both slices; if the layout is unrecognisable, say so loudly
          # rather than passing the check silently.
          app=$(find dist -maxdepth 3 -name '*.app' -type d | head -n 1)
          exe=""
          if [ -n "$app" ]; then
            exe=$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
          fi
          if [ -n "$exe" ]; then
            archs=$(lipo -archs "$exe")
            echo "macOS app architectures: $archs"
            echo "$archs" | grep -q x86_64 || { echo "::error::the DMG app is missing x86_64 (Intel Macs would break)"; exit 1; }
            echo "$archs" | grep -q arm64  || { echo "::error::the DMG app is missing arm64 (Apple Silicon Macs would break)"; exit 1; }
          else
            echo "::warning::could not locate the built .app executable to verify universal slices; DMG was still published"
          fi
          ls -la dist/IEM-Tool.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IEM-Tool-macOS
          path: dist/IEM-Tool.dmg

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IEM-Tool.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Update rolling latest release (overwrite)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          # Plain YAML scalar, so no ": " anywhere in it - a colon-space inside
          # an unquoted value is a mapping delimiter and fails to parse the file.
          body: Automatically rebuilt on every push to main. Exactly one file per operating system - IEM-Tool-Setup.exe (Windows installer), IEM-Tool.dmg (macOS, runs on both Intel and Apple Silicon) and IEM-Tool.appimage (Linux; run chmod +x first).
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: release-files/IEM-Tool-Windows/IEM-Tool-Setup.exe,release-files/IEM-Tool-macOS/IEM-Tool.dmg,release-files/IEM-Tool-Linux/IEM-Tool.appimage